<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAGPT 服务商申请管理</title>
  <link rel="stylesheet" href="/admin-assets/admin.css">
</head>
<body>
  <section id="login-view" class="login-view">
    <div class="login-panel">
      <div class="brand-mark">S</div>
      <p class="eyebrow">SAGPT OPERATIONS</p>
      <h1>服务商申请管理</h1>
      <p class="muted">请输入后台 API Key 查看和处理服务商申请。</p>
      <label for="api-key-input">API Key</label>
      <input id="api-key-input" type="password" autocomplete="current-password" placeholder="输入后台 API Key">
      <p id="login-error" class="error-text"></p>
      <button id="login-button">进入后台</button>
    </div>
  </section>

  <section id="dashboard-view" class="hidden">
    <header class="topbar">
      <div>
        <p class="eyebrow">SAGPT OPERATIONS</p>
        <h1>服务商申请管理</h1>
      </div>
      <div class="topbar-actions">
        <button id="demands-button" class="secondary" type="button">需求后台</button>
        <button id="refresh-button" class="secondary" type="button">刷新</button>
        <button id="export-button" type="button">下载 CSV</button>
        <button id="logout-button" class="secondary" type="button">退出</button>
      </div>
    </header>

    <main>
      <section class="stats" aria-label="申请统计">
        <div class="stat"><span class="stat-label">全部申请</span><strong id="stat-total" class="stat-value">0</strong></div>
        <div class="stat"><span class="stat-label">待审核</span><strong id="stat-pending" class="stat-value">0</strong></div>
        <div class="stat"><span class="stat-label">已联系</span><strong id="stat-contacted" class="stat-value">0</strong></div>
        <div class="stat"><span class="stat-label">已通过</span><strong id="stat-approved" class="stat-value">0</strong></div>
        <div class="stat"><span class="stat-label">已拒绝</span><strong id="stat-rejected" class="stat-value">0</strong></div>
      </section>

      <section class="workspace">
        <div class="list-pane">
          <div class="filters">
            <input id="search-input" type="search" placeholder="搜索姓名、邮箱、简介或服务领域">
            <select id="status-filter">
              <option value="">全部状态</option>
              <option value="pending">待审核</option>
              <option value="contacted">已联系</option>
              <option value="approved">已通过</option>
              <option value="rejected">已拒绝</option>
            </select>
            <input id="country-filter" type="search" placeholder="目标国家">
            <button id="filter-button" type="button">筛选</button>
            <button id="clear-button" class="secondary" type="button">清除</button>
          </div>
          <div id="error-banner" class="error-banner hidden"></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>提交时间</th>
                  <th>姓名/机构</th>
                  <th>邮箱</th>
                  <th>目标国家</th>
                  <th>服务类别</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody id="provider-table-body"></tbody>
            </table>
          </div>
          <div id="empty-state" class="empty-state hidden">暂无符合条件的服务商申请</div>
          <div class="pagination">
            <span id="page-summary">第 1 / 1 页，共 0 条</span>
            <div>
              <button id="prev-button" class="secondary" type="button">上一页</button>
              <button id="next-button" class="secondary" type="button">下一页</button>
            </div>
          </div>
        </div>

        <aside id="detail-panel" class="detail-panel">
          <div id="detail-placeholder" class="detail-placeholder">选择一条申请查看完整信息</div>
          <div id="detail-content" class="hidden">
            <div class="detail-header">
              <div>
                <p class="eyebrow">申请详情</p>
                <h2 id="detail-name"></h2>
              </div>
              <button id="close-detail-button" class="icon-button" type="button" aria-label="关闭详情">×</button>
            </div>
            <dl class="detail-grid">
              <div><dt>提交时间</dt><dd id="detail-created"></dd></div>
              <div><dt>状态</dt><dd id="detail-status"></dd></div>
              <div><dt>邮箱</dt><dd id="detail-email"></dd></div>
              <div><dt>经验年限</dt><dd id="detail-experience"></dd></div>
              <div><dt>目标国家</dt><dd id="detail-countries"></dd></div>
              <div><dt>服务类别</dt><dd id="detail-categories"></dd></div>
            </dl>
            <section class="detail-section">
              <h3>服务简介</h3>
              <p id="detail-bio"></p>
            </section>
            <section class="detail-section">
              <h3>作品/链接</h3>
              <p id="detail-portfolio"></p>
            </section>
            <form id="status-form" class="status-form">
              <label for="status-select">审核状态</label>
              <select id="status-select">
                <option value="pending">待审核</option>
                <option value="contacted">已联系</option>
                <option value="approved">已通过</option>
                <option value="rejected">已拒绝</option>
              </select>
              <label for="reviewed-by-input">处理人</label>
              <input id="reviewed-by-input" type="text" maxlength="200" placeholder="例如：Chloe">
              <label for="review-notes-input">处理备注</label>
              <textarea id="review-notes-input" maxlength="1000" placeholder="记录联系结果、审核意见或下一步安排"></textarea>
              <button id="save-status-button" type="submit">保存状态</button>
              <p id="status-message"></p>
            </form>
          </div>
        </aside>
      </section>
    </main>
  </section>

  <script src="/admin-assets/providers.js"></script>
</body>
</html>
