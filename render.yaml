services:
  - type: web
    name: sagpt-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sagpt-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false  # 用户需要在 Render Dashboard 手动填入
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_ALLOWED_PRICE_IDS
        value: price_1TYj5JABXtDkfWuyQ4FD7AxQ,price_1TYj6KABXtDkfWuyfS7nqBG6,price_1TYjBgABXtDkfWuyIfvwPG96,price_1TYjDAABXtDkfWuyuVp5Slhz,price_1TYjEmABXtDkfWuyzVy2tFmM,price_1TYjFfABXtDkfWuyv9p5AvoC
      - key: STRIPE_SUCCESS_URL
        value: https://www.sagpt.com/pricing?success=true
      - key: STRIPE_CANCEL_URL
        value: https://www.sagpt.com/pricing?canceled=true
      - key: AUTH_COOKIE_DOMAIN
        value: .sagpt.com
      - key: APP_BASE_URL
        value: https://www.sagpt.com
      - key: API_BASE_URL
        value: https://api.sagpt.com
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_FROM_EMAIL
        value: SAGPT <account@mail.sagpt.com>
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4
      - key: OPENAI_MODEL
        value: glm-4.7
      - key: EMBEDDING_MODEL
        value: BAAI/bge-large-zh-v1.5
      - key: USE_FREE_MODEL_TIER
        value: "false"
      - key: FREE_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: ALLOWED_ORIGINS
        value: https://sagpt.com,https://www.sagpt.com,http://localhost:3000,http://localhost:5173,https://readdy.ai
      - key: API_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    autoDeploy: true

  # Optional: If you want to add a custom domain later
  # Uncomment and modify:
  # - type: web
  #   name: sagpt-api-custom
  #   domain: api.sagpt.com

databases:
  - name: sagpt-db
    databaseName: sagpt
    user: sagpt
    plan: free  # Render free PostgreSQL (limited, enough for testing)
    # Note: Render free PostgreSQL has limitations. 
    # For production, upgrade to starter plan ($7/month)
    # Or use Neon PostgreSQL free tier (see README for alternative)
